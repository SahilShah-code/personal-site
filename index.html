<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahil</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --muted: #999999;
      --hair: #e6e6e6;
      --up: #1a7f3c;
      --down: #b03030;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", "Courier", monospace;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 28px 32px;
    }

    /* ---- top bar ---- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .name { font-weight: 400; cursor: pointer; }
    .cursor {
      display: inline-block;
      width: 7px;
      background: var(--ink);
      margin-left: 1px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .date {
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ---- main / views ---- */
    main { flex: 1; display: flex; align-items: center; }
    .view { display: none; width: 100%; }
    .view.active { display: block; }
    #view-home.active { display: flex; align-items: center; }

    /* ---- tab list (home) ---- */
    nav ul { list-style: none; }
    nav li { margin: 2px 0; }
    nav a {
      color: var(--ink);
      text-decoration: none;
      display: inline-block;
      transition: transform 0.18s ease, opacity 0.18s ease;
      opacity: 0;
    }
    nav a .idx { color: var(--muted); margin-right: 14px; }
    nav a:hover { transform: translateX(10px); }
    nav a:hover .idx { color: var(--ink); }
    body.ready nav a { opacity: 1; }
    body.ready nav li:nth-child(1) a { transition-delay: 0.05s; }
    body.ready nav li:nth-child(2) a { transition-delay: 0.15s; }
    body.ready nav li:nth-child(3) a { transition-delay: 0.25s; }
    body.ready nav li:nth-child(4) a { transition-delay: 0.35s; }

    /* ---- prediction markets view ---- */
    .back {
      color: var(--muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 34px;
      transition: color 0.18s ease, transform 0.18s ease;
    }
    .back:hover { color: var(--ink); transform: translateX(-6px); }

    .pm-title { font-size: 14px; color: var(--muted); margin-bottom: 6px; }

    .pnl-big {
      font-size: 42px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      margin: 2px 0 2px;
    }
    .pnl-sub { font-size: 12px; color: var(--muted); }

    .up { color: var(--up); }
    .down { color: var(--down); }

    /* ---- sparkline (interactive) ---- */
    .spark-wrap { position: relative; margin: 22px 0 40px; }
    .spark { width: 100%; height: 84px; display: block; cursor: crosshair; }
    .spark-path { transition: stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1); }
    .spark-guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; transition: opacity .12s ease; }
    .spark-hover-dot { opacity: 0; transition: opacity .12s ease; }
    .spark-tip {
      position: absolute; top: 0; transform: translate(-50%, -120%);
      background: var(--ink); color: var(--paper);
      font-size: 10px; letter-spacing: .04em;
      padding: 2px 7px; border-radius: 2px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity .12s ease;
      font-variant-numeric: tabular-nums;
    }

    /* ---- filter chips ---- */
    .filters { display: flex; gap: 8px; margin: 0 0 14px; }
    .chip {
      font-family: inherit; font-size: 11px; letter-spacing: .08em;
      color: var(--muted); background: none; border: 1px solid var(--hair);
      padding: 3px 11px; border-radius: 2px; cursor: pointer;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .chip:hover { color: var(--ink); border-color: var(--muted); }
    .chip.active { color: var(--paper); background: var(--ink); border-color: var(--ink); }

    /* ---- tables ---- */
    section { margin-bottom: 40px; }
    section h2 {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin: 0 0 12px;
    }
    .rows { width: 100%; border-collapse: collapse; }
    .rows th {
      text-align: left;
      font-weight: 400;
      color: var(--muted);
      font-size: 11px;
      padding: 0 16px 8px 0;
      border-bottom: 1px solid var(--hair);
      white-space: nowrap;
    }
    .rows th.num, .rows td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .rows th.sortable { cursor: pointer; user-select: none; transition: color .15s ease; }
    .rows th.sortable:hover { color: var(--ink); }
    .rows th .arrow { opacity: 0; margin-left: 4px; font-size: 9px; }
    .rows th.sorted { color: var(--ink); }
    .rows th.sorted .arrow { opacity: 1; }
    .rows td {
      padding: 11px 16px 11px 0;
      border-bottom: 1px solid var(--hair);
      vertical-align: top;
    }
    .rows tr:last-child td { border-bottom: none; }
    .rows tbody tr {
      transition: background .12s ease, transform .12s ease;
      animation: rowIn .4s ease both;
    }
    .rows tbody tr:hover { background: #fafafa; }
    .rows tbody tr:hover .mkt { transform: translateX(3px); }
    .mkt { max-width: 440px; transition: transform .12s ease; }
    .rows tbody tr:hover td.return { font-weight: 700; }
    .side-yes { color: var(--ink); }
    .side-no { color: var(--muted); }
    .empty { color: var(--muted); font-style: italic; }

    @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .live-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--up); margin-right: 7px; vertical-align: middle;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    .updated { color: var(--muted); font-size: 11px; margin-top: -20px; margin-bottom: 34px; }

    @media (max-width: 600px) {
      body { padding: 20px; }
      header { flex-direction: column; gap: 8px; }
      .date { text-align: left; }
      .pnl-big { font-size: 34px; }
      .rows .hide-sm { display: none; }
      .mkt { max-width: 230px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="name" id="home-link"><span id="typed"></span><span class="cursor">&nbsp;</span></div>
    <div class="date" id="date"></div>
  </header>

  <main>
    <!-- HOME -->
    <div class="view active" id="view-home">
      <nav>
        <ul>
          <li><a href="#about"><span class="idx">01</span>about</a></li>
          <li><a href="#prediction-markets"><span class="idx">02</span>prediction markets</a></li>
          <li><a href="#biotech"><span class="idx">03</span>biotech</a></li>
          <li><a href="#documentaries"><span class="idx">04</span>documentaries</a></li>
        </ul>
      </nav>
    </div>

    <!-- PREDICTION MARKETS -->
    <div class="view" id="view-prediction-markets">
      <a href="#" class="back" id="pm-back">&larr; back</a>

      <div class="pm-title">02 / prediction markets &mdash; kalshi</div>

      <div class="pnl-big" id="pnl-net">—</div>
      <div class="pnl-sub" id="pnl-breakdown">&nbsp;</div>

      <div class="spark-wrap">
        <svg class="spark" id="spark" viewBox="0 0 600 84" preserveAspectRatio="none"></svg>
        <div class="spark-tip" id="spark-tip"></div>
      </div>

      <section>
        <h2><span class="live-dot"></span>active positions</h2>
        <table class="rows">
          <thead>
            <tr>
              <th>market</th>
              <th class="num">side</th>
              <th class="num hide-sm">avg</th>
              <th class="num hide-sm">last</th>
              <th class="num">return</th>
            </tr>
          </thead>
          <tbody id="active-rows"></tbody>
        </table>
      </section>

      <section>
        <h2 id="settled-head">settled &mdash; historicals</h2>
        <div class="filters" id="pm-filters">
          <button class="chip active" data-filter="all">all</button>
          <button class="chip" data-filter="wins">wins</button>
          <button class="chip" data-filter="losses">losses</button>
        </div>
        <table class="rows">
          <thead>
            <tr>
              <th class="sortable" data-sort="title">market<span class="arrow"></span></th>
              <th class="num hide-sm sortable" data-sort="result">result<span class="arrow"></span></th>
              <th class="num hide-sm sortable sorted" data-sort="date">date<span class="arrow">▼</span></th>
              <th class="num sortable" data-sort="return_pct">return<span class="arrow"></span></th>
            </tr>
          </thead>
          <tbody id="settled-rows"></tbody>
        </table>
      </section>

      <div class="updated" id="pm-updated"></div>
    </div>
  </main>

  <script>
    /* =========================================================================
       DATA LOADING
       -------------------------------------------------------------------------
       Reads a static, pre-sanitized JSON file (data/kalshi.json) produced by a
       scheduled GitHub Action. PERCENTAGES ONLY — no dollar amounts or sizes.
       Falls back to SAMPLE if the file can't load (e.g. file:// preview).
       ========================================================================= */
    const SAMPLE = {
      updated: "sample data — not yet connected to your kalshi account",
      net_return_pct: 12.4, realized_return_pct: 15.1, unrealized_return_pct: 8.2, win_rate_pct: 66.7,
      settled_total: 6,
      curve: [0, 6.1, 3.9, -2.4, 4.7, 11.0, 15.1],
      active: [
        { title: "Fed cuts rates in Sept 2026",      side: "yes", avg: 61, last: 68, return_pct: 11.5 },
        { title: "S&P 500 closes above 6500 in 2026", side: "yes", avg: 55, last: 62, return_pct: 12.7 },
      ],
      settled: [
        { title: "CPI above 3.0% (June 2026)",       result: "yes", date: "2026-07-11", return_pct: 42.0 },
        { title: "Gov shutdown before July 2026",     result: "no",  date: "2026-06-30", return_pct: 18.5 },
        { title: "BTC above $100k (June 2026)",       result: "no",  date: "2026-06-28", return_pct: -100.0 },
        { title: "Jobs report beats estimate (May)",  result: "yes", date: "2026-06-06", return_pct: 63.0 },
        { title: "Fed holds rates (May 2026)",        result: "yes", date: "2026-05-01", return_pct: 27.5 },
        { title: "Oscars host confirmed by Feb",      result: "no",  date: "2026-02-15", return_pct: -35.0 },
      ],
    };

    async function loadPortfolio() {
      try {
        const res = await fetch("./data/kalshi.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        return await res.json();
      } catch (_) { return SAMPLE; }
    }

    /* ---------- formatting ---------- */
    const fmtPct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%";
    const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");

    /* ---------- interactive state ---------- */
    let PF = null;                                   // loaded portfolio
    let settledFilter = "all";                       // all | wins | losses
    let settledSort = { key: "date", dir: "desc" };  // current sort

    /* ---------- animated count-up for the headline ---------- */
    function animateNumber(el, target) {
      const dur = 950, t0 = performance.now();
      function step(t) {
        const p = Math.min(1, (t - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
        const v = target * eased;
        el.textContent = fmtPct(v);
        el.classList.remove("up", "down");
        el.classList.add(v >= 0 ? "up" : "down");
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* ---------- render ---------- */
    function renderPortfolio(p) {
      PF = p;
      animateNumber(document.getElementById("pnl-net"), p.net_return_pct);
      document.getElementById("pnl-breakdown").textContent =
        `net return  ·  realized ${fmtPct(p.realized_return_pct)}  ·  unrealized ${fmtPct(p.unrealized_return_pct)}  ·  win rate ${p.win_rate_pct.toFixed(0)}%`;

      renderActive();
      renderSettled();
      drawSpark(p.curve);

      document.getElementById("pm-updated").textContent =
        (typeof p.updated === "string" && p.updated.includes("sample")) ? p.updated : "updated " + p.updated;
    }

    function renderActive() {
      const body = document.getElementById("active-rows");
      if (!PF.active || !PF.active.length) {
        body.innerHTML = `<tr><td class="empty" colspan="5">— no open positions —</td></tr>`;
        return;
      }
      body.innerHTML = PF.active.map((pos, i) => `
        <tr style="animation-delay:${i * 0.03}s">
          <td class="mkt">${pos.title}</td>
          <td class="num"><span class="side-${pos.side}">${pos.side.toUpperCase()}</span></td>
          <td class="num hide-sm">${pos.avg}¢</td>
          <td class="num hide-sm">${pos.last}¢</td>
          <td class="num return ${cls(pos.return_pct)}">${fmtPct(pos.return_pct)}</td>
        </tr>`).join("");
    }

    function renderSettled() {
      // filter
      let rows = [...(PF.settled || [])];
      if (settledFilter === "wins")   rows = rows.filter(r => r.return_pct > 0);
      if (settledFilter === "losses") rows = rows.filter(r => r.return_pct < 0);

      // sort
      const { key, dir } = settledSort;
      const mul = dir === "asc" ? 1 : -1;
      rows.sort((a, b) => {
        let av = a[key], bv = b[key];
        if (typeof av === "string") return mul * av.localeCompare(bv);
        return mul * ((av ?? 0) - (bv ?? 0));
      });

      // header: count + sort indicators
      const head = document.getElementById("settled-head");
      const total = PF.settled_total || (PF.settled ? PF.settled.length : 0);
      const showing = rows.length;
      head.innerHTML = `settled &mdash; historicals <span style="color:var(--muted)">(${showing}${settledFilter === "all" && total > (PF.settled || []).length ? " of " + total : ""})</span>`;
      document.querySelectorAll('#view-prediction-markets th[data-sort]').forEach(th => {
        const on = th.dataset.sort === key;
        th.classList.toggle("sorted", on);
        th.querySelector(".arrow").textContent = on ? (dir === "asc" ? "▲" : "▼") : "";
      });

      // body
      const body = document.getElementById("settled-rows");
      if (!rows.length) { body.innerHTML = `<tr><td class="empty" colspan="4">— none —</td></tr>`; return; }
      body.innerHTML = rows.map((x, i) => `
        <tr style="animation-delay:${Math.min(i, 20) * 0.025}s">
          <td class="mkt">${x.title}</td>
          <td class="num hide-sm"><span class="side-${x.result}">${(x.result || "").toUpperCase()}</span></td>
          <td class="num hide-sm">${x.date}</td>
          <td class="num return ${cls(x.return_pct)}">${fmtPct(x.return_pct)}</td>
        </tr>`).join("");
    }

    /* ---------- interactive sparkline ---------- */
    let sparkPts = [];
    function drawSpark(pts) {
      const svg = document.getElementById("spark");
      sparkPts = pts || [];
      if (!pts || pts.length < 2) { svg.innerHTML = ""; return; }
      const W = 600, H = 84, pad = 6;
      const min = Math.min(...pts, 0), max = Math.max(...pts, 0);
      const span = (max - min) || 1;
      const X = i => pad + (i * (W - pad * 2)) / (pts.length - 1);
      const Y = v => H - pad - ((v - min) / span) * (H - pad * 2);
      const line = pts.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
      const zeroY = Y(0).toFixed(1);
      const last = pts[pts.length - 1];
      const color = last >= 0 ? "var(--up)" : "var(--down)";
      svg.innerHTML = `
        <line x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" stroke="var(--hair)" stroke-width="1"/>
        <path class="spark-path" d="${line}" fill="none" stroke="${color}" stroke-width="1.5"/>
        <line class="spark-guide" id="spark-guide" x1="0" y1="0" x2="0" y2="${H}"/>
        <circle class="spark-hover-dot" id="spark-hdot" r="3" fill="${color}"/>
        <circle cx="${X(pts.length - 1)}" cy="${Y(last)}" r="2.5" fill="${color}"/>
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="spark-hit"/>`;

      // animate the line drawing in
      const path = svg.querySelector(".spark-path");
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });

      // store coord fns for hover
      svg._X = X; svg._Y = Y; svg._n = pts.length;
    }

    (function wireSparkHover() {
      const svg = document.getElementById("spark");
      const tip = document.getElementById("spark-tip");
      svg.addEventListener("mousemove", (e) => {
        if (!sparkPts.length || !svg._X) return;
        const rect = svg.getBoundingClientRect();
        const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const idx = Math.round(frac * (svg._n - 1));
        const val = sparkPts[idx];
        const gx = svg._X(idx), gy = svg._Y(val);
        const guide = document.getElementById("spark-guide");
        const dot = document.getElementById("spark-hdot");
        guide.setAttribute("x1", gx); guide.setAttribute("x2", gx);
        guide.style.opacity = 1;
        dot.setAttribute("cx", gx); dot.setAttribute("cy", gy); dot.style.opacity = 1;
        tip.textContent = fmtPct(val);
        tip.style.left = (gx / 600 * rect.width) + "px";
        tip.style.top = (gy / 84 * rect.height) + "px";
        tip.style.opacity = 1;
      });
      svg.addEventListener("mouseleave", () => {
        tip.style.opacity = 0;
        const g = document.getElementById("spark-guide"); if (g) g.style.opacity = 0;
        const d = document.getElementById("spark-hdot"); if (d) d.style.opacity = 0;
      });
    })();

    /* ---------- filter + sort controls ---------- */
    document.querySelectorAll("#pm-filters .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll("#pm-filters .chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        settledFilter = chip.dataset.filter;
        renderSettled();
      });
    });
    document.querySelectorAll('#view-prediction-markets th[data-sort]').forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (settledSort.key === key) {
          settledSort.dir = settledSort.dir === "asc" ? "desc" : "asc";
        } else {
          settledSort.key = key;
          settledSort.dir = (key === "title" || key === "result") ? "asc" : "desc";
        }
        renderSettled();
      });
    });

    /* =========================================================================
       ROUTING (direct click handlers; hash is best-effort only)
       ========================================================================= */
    const VIEWS = new Set(["home", "prediction-markets"]);
    let pmLoaded = false;
    function show(view) {
      if (!VIEWS.has(view)) view = "home";
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + view).classList.add("active");
      try { history.replaceState(null, "", view === "home" ? "#" : "#" + view); } catch (_) {}
      if (view === "prediction-markets" && !pmLoaded) {
        pmLoaded = true;
        loadPortfolio().then(renderPortfolio);
      }
    }
    document.querySelectorAll("nav a").forEach(a => {
      a.addEventListener("click", (e) => { e.preventDefault(); show(a.getAttribute("href").replace("#", "")); });
    });
    document.getElementById("home-link").addEventListener("click", () => show("home"));
    document.getElementById("pm-back").addEventListener("click", (e) => { e.preventDefault(); show("home"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") show("home"); });

    /* =========================================================================
       TOP BAR
       ========================================================================= */
    function renderDate() {
      const d = new Date();
      document.getElementById("date").textContent =
        d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }).toLowerCase();
    }
    renderDate();
    setInterval(renderDate, 60 * 1000);

    const NAME = "sahil";
    const typed = document.getElementById("typed");
    let i = 0;
    (function type() {
      if (i <= NAME.length) { typed.textContent = NAME.slice(0, i); i++; setTimeout(type, 110); }
      else { document.body.classList.add("ready"); }
    })();

    show(location.hash.replace("#", "") || "home");
  </script>
</body>
</html>
