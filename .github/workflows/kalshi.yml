name: refresh kalshi snapshot

# Fetches your Kalshi portfolio, writes data/kalshi.json (percentages only),
# and commits it back so GitHub Pages serves fresh data.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

# Allow the workflow to push the updated JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi portfolio
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DEBUG: "1"   # first-run only: dumps raw responses to data/_debug/ (gitignored). Remove once field mapping is confirmed.
        run: node scripts/fetch-kalshi.mjs

      # TEMPORARY: makes the raw debug dump downloadable from the Actions run page
      # WITHOUT committing sensitive financial data to git history or Pages.
      # Delete this step (and DEBUG above) once the field mapping is confirmed.
      - name: Upload debug dump (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-debug
          path: data/_debug/
          retention-days: 1
          if-no-files-found: warn

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/kalshi.json; then
            git add data/kalshi.json
            git commit -m "chore: refresh kalshi snapshot"
            git push
          else
            echo "No change in data/kalshi.json"
          fi
