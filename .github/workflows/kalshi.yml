name: refresh kalshi snapshot

# Fetches your Kalshi portfolio, writes data/kalshi.json (percentages only),
# and commits it back so GitHub Pages serves fresh data.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

# Allow the workflow to push the updated JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi portfolio
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          # To re-diagnose later, set DEBUG: "1" here — the script writes raw
          # responses + a per-market breakdown to data/_debug/ (gitignored) and
          # logs field schemas. Off for normal runs.
        run: node scripts/fetch-kalshi.mjs

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/kalshi.json; then
            echo "No change in data/kalshi.json"; exit 0
          fi
          git add data/kalshi.json
          git commit -m "chore: refresh kalshi snapshot"
          # Integrate anything that landed since checkout, then push. Retry once
          # to survive a concurrent commit racing us to the ref.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep 3
          done
          echo "could not push after retries"; exit 1
