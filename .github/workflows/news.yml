name: refresh feed + signals

# Pulls news headlines (Google News RSS) -> data/news.json, then derives
# news-driven "markets to watch" (Polymarket) -> data/market-signals.json.
# Feeds the thinking page's "the feed" and "markets to watch" tools.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch news
        run: node scripts/fetch-news.mjs

      - name: Fetch market signals
        run: node scripts/fetch-signals.mjs

      - name: Commit updated feed + signals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json data/market-signals.json; then
            echo "No change"; exit 0
          fi
          git add data/news.json data/market-signals.json
          git commit -m "chore: refresh feed + market signals"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep 3
          done
          echo "could not push after retries"; exit 1
